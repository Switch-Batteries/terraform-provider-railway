# Environment-scoped on purpose: updateServiceInstance in resource_service.graphql
# passes environmentId: null, which Railway applies to every non-fork environment
# in the project. A credential is per service instance, so this names its
# environment.
#
# The credential is the only field sent. Binding $input to the generated
# ServiceInstanceUpdateInput would serialise its cronSchedule as an explicit
# null, which Railway treats as "clear the schedule".
mutation updateServiceInstanceRegistryCredentials(
  $environmentId: String!
  $serviceId: String!
  $username: String!
  $password: String!
) {
  serviceInstanceUpdate(
    environmentId: $environmentId
    serviceId: $serviceId
    input: { registryCredentials: { username: $username, password: $password } }
  )
}
